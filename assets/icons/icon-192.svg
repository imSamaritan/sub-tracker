<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="randGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Wallet / Card Icon -->
  <rect x="40" y="48" width="112" height="96" rx="18" fill="url(#accentGrad)"/>
  <path d="M 40 76 L 152 76" stroke="#ffffff" stroke-width="6" stroke-opacity="0.3"/>
  <!-- Rand Symbol Badge -->
  <circle cx="120" cy="98" r="24" fill="url(#randGrad)"/>
  <text x="120" y="107" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">R</text>
  <!-- South Africa Accent Colors (Green & Gold mini-dot) -->
  <circle cx="58" cy="120" r="5" fill="#f59e0b"/>
  <circle cx="72" cy="120" r="5" fill="#10b981"/>
</svg>
